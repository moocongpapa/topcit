<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="2026 TOPCIT 공식 평가체계를 반영한 개념·퀴즈·계산기·실무 학습 페이지"
    />
    <title>TOPCIT Study Lab · 2026 학습 워크스페이스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (window.tailwind)
        tailwind.config = { corePlugins: { preflight: false } };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./study.css" />
    <style>
      :root {
        --bg: #f3f5f9;
        --panel: #fff;
        --ink: #18243b;
        --muted: #64748b;
        --line: #e2e8f0;
        --brand: #315be8;
        --soft: #edf2ff;
      }
      html.dark {
        --bg: #101624;
        --panel: #192235;
        --ink: #e7edf8;
        --muted: #a2b1ca;
        --line: #303e56;
        --brand: #91abff;
        --soft: #243354;
      }
      * {
        box-sizing: border-box;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      button,
      input,
      select,
      textarea {
        min-width: 0;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter,
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 16px;
        line-height: 1.7;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      a {
        color: var(--brand);
      }
      button,
      summary {
        cursor: pointer;
      }
      button {
        border: 0;
        background: none;
        color: inherit;
      }
      button:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 3px;
      }
      body input,
      body textarea,
      body select {
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        width: 100%;
      }
      aside {
        position: fixed;
        inset: 0 auto 0 0;
        width: 260px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 28px 20px;
        overflow: auto;
        z-index: 30;
      }
      .logo {
        font-weight: 850;
        font-size: 23px;
        letter-spacing: -1px;
      }
      .logo b {
        display: inline-grid;
        place-items: center;
        background: #315be8;
        color: white;
        border-radius: 10px;
        width: 36px;
        height: 36px;
        margin-right: 8px;
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 2px;
        color: var(--brand);
      }
      nav {
        margin-top: 32px;
      }
      nav button {
        display: block;
        text-align: left;
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 14px;
      }
      nav button:hover,
      nav button.active {
        background: var(--soft);
        color: var(--brand);
      }
      nav summary {
        font-size: 14px;
        padding: 12px 0;
        font-weight: 700;
      }
      nav details details {
        padding-left: 10px;
      }
      nav details details summary {
        font-weight: 500;
      }
      nav .topiclink {
        font-size: 13px;
        padding-left: 18px;
      }
      main {
        margin-left: 260px;
        min-height: 100vh;
      }
      .topbar {
        padding: 20px 36px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 18px;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .search {
        position: relative;
        max-width: 640px;
        flex: 1;
      }
      .search input {
        padding-left: 40px;
        background: var(--bg);
      }
      .search i {
        position: absolute;
        left: 14px;
        top: 16px;
        color: var(--muted);
      }
      .iconbtn {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 13px;
        white-space: nowrap;
      }
      .content {
        max-width: 1240px;
        margin: auto;
        padding: 34px 38px 70px;
      }
      body h1 {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -1px;
        margin: 6px 0;
      }
      body h2 {
        font-size: 22px;
        font-weight: 750;
        margin: 0;
      }
      body h3 {
        font-size: 18px;
        font-weight: 700;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .domain {
        border-top: 3px solid var(--brand);
        text-align: left;
        width: 100%;
      }
      .domain:nth-child(2) {
        border-top-color: #0b968b;
      }
      .domain:nth-child(3) {
        border-top-color: #ae72df;
      }
      .domain:nth-child(4) {
        border-top-color: #e58b32;
      }
      .domain strong {
        font-size: 28px;
      }
      .pill {
        display: inline-block;
        background: var(--soft);
        color: var(--brand);
        border-radius: 6px;
        padding: 3px 9px;
        font-size: 12px;
        font-weight: 650;
      }
      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 28px 0 22px;
      }
      .tabs button {
        padding: 9px 17px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--panel);
        font-size: 14px;
      }
      .tabs button.active,
      .primary {
        background: #315be8 !important;
        color: white !important;
        border-color: #315be8 !important;
      }
      .primary,
      .secondary {
        padding: 10px 16px;
        border-radius: 9px;
        font-weight: 650;
        font-size: 14px;
      }
      .secondary {
        border: 1px solid var(--line);
      }
      .sectionhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 28px 0 16px;
        gap: 12px;
      }
      .topic {
        margin-bottom: 12px;
      }
      .topic summary {
        list-style: none;
        display: flex;
        justify-content: space-between;
        gap: 14px;
        font-weight: 700;
      }
      .topic summary::-webkit-details-marker {
        display: none;
      }
      .topic summary:after {
        content: "+";
        color: var(--brand);
      }
      .topic[open] summary:after {
        content: "−";
      }
      .topic p {
        margin: 16px 0 4px;
        color: var(--muted);
        line-height: 1.9;
      }
      .topic .tags {
        margin-top: 14px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .deep-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }
      .deep-box {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 15px;
      }
      .deep-box strong {
        display: block;
        color: var(--brand);
        font-size: 13px;
        margin-bottom: 7px;
      }
      .deep-box p {
        margin: 0;
        font-size: 14px;
        line-height: 1.65;
      }
      .official-banner {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        background: linear-gradient(135deg, #315be8, #5a39c9);
        color: #fff;
        border-radius: 16px;
        padding: 20px 24px;
        margin: 20px 0;
      }
      .official-banner p {
        margin: 4px 0 0;
        color: #e5eaff;
      }
      .source-list {
        display: grid;
        gap: 10px;
      }
      .source-list a {
        display: block;
        color: var(--brand);
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
      }
      .source-list a:hover {
        text-decoration: underline;
      }
      .past-paper-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      .past-paper-grid a {
        display: block;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        color: var(--text);
        text-decoration: none;
      }
      .past-paper-grid a:hover {
        border-color: var(--brand);
        color: var(--brand);
      }
      .past-paper-grid small {
        display: block;
        color: var(--muted);
        margin-top: 5px;
      }
      .quiz-pager {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 20px 0;
      }
      .strategy-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      .strategy-table th,
      .strategy-table td {
        border-bottom: 1px solid var(--line);
        padding: 12px;
        text-align: left;
      }
      .strategy-table th {
        color: var(--brand);
        font-size: 13px;
      }
      .exam-note {
        border-left: 4px solid #e58b32;
        background: var(--soft);
        padding: 15px 18px;
        border-radius: 0 10px 10px 0;
        margin: 16px 0;
      }
      .textbook-card {
        margin-bottom: 18px;
      }
      .textbook-card summary {
        list-style: none;
        display: flex;
        justify-content: space-between;
        gap: 14px;
        font-weight: 750;
        font-size: 17px;
      }
      .textbook-card summary::-webkit-details-marker {
        display: none;
      }
      .textbook-card summary:after {
        content: "+";
        color: var(--brand);
      }
      .textbook-card[open] summary:after {
        content: "−";
      }
      .textbook-card > p {
        color: var(--muted);
      }
      .lesson {
        border-top: 1px solid var(--line);
        padding: 18px 0 4px;
        margin-top: 14px;
      }
      .lesson h4 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .lesson p,
      .lesson li {
        color: var(--muted);
        line-height: 1.75;
      }
      .lesson ul {
        margin: 8px 0 0;
        padding-left: 21px;
      }
      .formula {
        display: block;
        background: #111d32;
        color: #d7e6ff;
        border-radius: 10px;
        padding: 12px 15px;
        margin: 10px 0;
        overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 14px;
      }
      .term {
        color: var(--ink);
        font-weight: 700;
      }
      .book-filter {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 18px 0;
      }
      .book-filter button {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 13px;
        background: var(--panel);
      }
      .book-filter button.active {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      .review-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 18px 0;
      }
      .review-stats .panel {
        padding: 16px;
      }
      .review-stats strong {
        display: block;
        font-size: 25px;
        line-height: 1.2;
        color: var(--brand);
      }
      .review-stats span {
        color: var(--muted);
        font-size: 13px;
      }
      .review-controls {
        display: flex;
        gap: 12px;
        align-items: end;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .review-controls label {
        min-width: 180px;
        font-size: 13px;
        color: var(--muted);
      }
      .review-controls select {
        margin-top: 5px;
      }
      .review-card {
        border-top: 4px solid var(--brand);
      }
      .review-card h3 {
        margin: 20px 0;
        font-size: 21px;
      }
      .review-answer {
        background: var(--soft);
        border-radius: 12px;
        padding: 18px;
        margin-top: 16px;
      }
      .review-answer p {
        margin: 7px 0 0;
      }
      .review-meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        color: var(--muted);
        font-size: 13px;
      }
      .review-empty {
        text-align: center;
        padding: 36px 18px;
      }
      .review-empty .actions {
        justify-content: center;
      }
      .question {
        margin-bottom: 18px;
      }
      .question h3 {
        margin: 14px 0;
      }
      .option {
        display: block;
        margin: 8px 0;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .option input {
        width: auto;
        margin-right: 9px;
      }
      .answer {
        border-left: 3px solid #0b968b;
        background: var(--soft);
        padding: 16px;
        margin-top: 16px;
        border-radius: 0 9px 9px 0;
      }
      .answer[hidden] {
        display: none;
      }
      .answer p {
        white-space: pre-wrap;
      }
      mark {
        background: #fff0a5;
        color: #443900;
        border-radius: 3px;
        padding: 1px 3px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 15px;
      }
      pre {
        background: #111d32;
        color: #d7e6ff;
        border-radius: 12px;
        padding: 20px;
        overflow: auto;
        font-size: 13px;
        line-height: 1.8;
        margin-top: 16px;
      }
      label.field {
        display: block;
        margin: 14px 0;
        color: var(--muted);
        font-size: 14px;
      }
      .result {
        background: var(--soft);
        border-radius: 12px;
        padding: 18px;
        margin-top: 20px;
      }
      .result b {
        font-size: 26px;
        color: var(--brand);
      }
      .note {
        font-size: 13px;
        color: var(--muted);
      }
      .mobile {
        display: none;
      }
      .backdrop {
        display: none;
      }
      .empty {
        text-align: center;
        padding: 55px;
      }
      .uml {
        max-width: 340px;
        text-align: center;
        border: 2px solid var(--brand);
        border-radius: 10px;
        margin: 18px auto;
        overflow: hidden;
      }
      .uml div {
        padding: 9px;
        border-bottom: 1px solid var(--line);
      }
      footer {
        margin-top: 38px;
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 900px) {
        aside {
          transform: translateX(-100%);
          transition: transform 0.2s;
        }
        aside.open {
          transform: translateX(0);
        }
        main {
          margin-left: 0;
        }
        .mobile {
          display: inline-block;
        }
        .backdrop.open {
          display: block;
          position: fixed;
          inset: 0;
          background: #0007;
          z-index: 25;
        }
        .topbar {
          padding: 14px 16px;
          gap: 9px;
        }
        .content {
          padding: 24px 18px 50px;
        }
        .grid2 {
          grid-template-columns: 1fr;
        }
        .theme-label {
          display: none;
        }
      }
      @media (max-width: 1050px) {
        .grid3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 760px) {
        .deep-grid {
          grid-template-columns: 1fr;
        }
        .official-banner {
          align-items: flex-start;
          flex-direction: column;
        }
        .strategy-table {
          font-size: 14px;
        }
      }
      @media (max-width: 560px) {
        .review-stats {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 7px;
        }
        .review-stats .panel {
          padding: 11px;
        }
        .review-stats strong {
          font-size: 20px;
        }
        .grid3 {
          grid-template-columns: 1fr;
        }
        .domain {
          padding: 16px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
        }
        .domain strong {
          font-size: 23px;
        }
        .domain .note {
          display: none;
        }
        body h1 {
          font-size: 26px;
        }
        .panel {
          padding: 19px;
        }
        .search input {
          font-size: 14px;
        }
        .topbar {
          gap: 7px;
        }
        .iconbtn {
          padding: 8px 10px;
        }
      }
    </style>
  </head>
  <body>
    <a href="#view" class="sr-only focus:not-sr-only">학습 내용으로 건너뛰기</a
    ><button id="backdrop" class="backdrop" aria-label="메뉴 닫기"></button>
    <aside id="sidebar">
      <div class="logo">
        <b>T</b> TOPCIT<span style="color: var(--brand)">.</span>
      </div>
      <div class="muted" style="font-size: 12px; margin: 9px 0 0 46px">
        STUDY LAB
      </div>
      <nav id="nav" aria-label="학습 단원"></nav>
      <div
        class="panel"
        style="padding: 15px; margin-top: 28px; background: var(--soft)"
      >
        <span class="eyebrow">STUDY TIP</span>
        <p style="font-size: 13px; margin-top: 8px">
          개념을 이해하고,<br />상황에 맞는 키워드로 답하세요.
        </p>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <button
          id="menu"
          class="iconbtn mobile"
          aria-label="학습 메뉴 열기"
          aria-expanded="false"
        >
          <span aria-hidden="true">☰</span>
        </button>
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i
          ><input
            id="search"
            type="search"
            aria-label="전체 학습 검색"
            placeholder="어떤 개념을 찾고 있나요?  예: Salt, EVM"
            autocomplete="off"
          />
        </div>
        <button id="theme" class="iconbtn" aria-label="다크 모드 전환">
          <i class="fa-regular fa-moon"></i>
          <span class="theme-label">테마</span>
        </button>
      </header>
      <div class="content">
        <div class="eyebrow">YOUR LEARNING WORKSPACE</div>
        <h1>개념부터 실전까지, 한 걸음씩.</h1>
        <p class="muted" style="margin: 6px 0 25px">
          2026 공식 평가모델의 4개 모듈을 연결해 이해하고, 직접 풀며 익혀보세요.
        </p>
        <div class="grid3" id="domains"></div>
        <div class="tabs" id="tabs" aria-label="학습 도구"></div>
        <div id="view" tabindex="-1"></div>
        <footer>
          2026 TOPCIT 공식 평가체계와 공식 기술 문서를 바탕으로 보강했습니다.
          연습문제는 공식 기출문제가 아닌 학습용 예제입니다.<br />외부 CDN
          사용으로 최초 스타일·아이콘 로딩에는 인터넷 연결이 필요합니다.
        </footer>
      </div>
    </main>
    <script src="./study-data.js"></script>
    <script>
      "use strict";
      const domains = [
        {
          id: "tech",
          name: "기술 영역",
          points: 565,
          count: 42,
          icon: "fa-code",
        },
        {
          id: "biz",
          name: "비즈니스 영역",
          points: 175,
          count: 20,
          icon: "fa-briefcase",
        },
        {
          id: "integrated",
          name: "통합 영역",
          points: 260,
          count: 3,
          icon: "fa-layer-group",
        },
      ];
      const examModules = [
        {
          id: "m1",
          name: "M1 소프트웨어 개발",
          points: 365,
          count: 21,
          icon: "fa-code",
          moduleIds: ["sw"],
          note: "공학 · 알고리즘 · AI · 분석 · 설계 · 구현 · 테스트",
        },
        {
          id: "m2",
          name: "M2 데이터 관리",
          points: 265,
          count: 19,
          icon: "fa-database",
          moduleIds: ["data"],
          note: "DB 설계 · 구축 · 운영 · 분석 · 데이터 기반 AI",
        },
        {
          id: "m3",
          name: "M3 아키텍처·보안",
          points: 235,
          count: 18,

        ).length;
        $("#view").innerHTML =
          `<div class="sectionhead"><div><div class="eyebrow">CORE TEXTBOOK</div><h2>시험에 필요한 실제 학습 본문</h2></div><span class="note">${list.length}개 대단원 · ${list.reduce((n, chapter) => n + chapter.lessons.length, 0)}개 소단원</span></div><p class="muted"><a href="https://www.topcit.or.kr/introduction/syllabus.do" target="_blank" rel="noopener">TOPCIT V4.0E 공식 출제기준</a>을 바탕으로 개념의 정의, 작동 원리, 공식과 예제를 정리했습니다. 각 소단원의 복습 카드로 기억을 확인하세요.</p><div class="official-banner"><div><strong>오늘 확인할 개념 ${dueCount}개</strong><p>답을 먼저 떠올린 뒤 해설을 확인해 보세요.</p></div><button class="secondary" id="openReview" style="color:white;border-color:#ffffff88">복습 시작</button></div><div class="book-filter"><button data-book="all" class="${bookModule === "all" ? "active" : ""}">전체</button>${examModules.map((m) => `<button data-book="${m.id}" class="${bookModule === m.id ? "active" : ""}">${m.id.toUpperCase()}</button>`).join("")}</div>${list.map((chapter) => bookCard(chapter)).join("")}`;
        $("#openReview").onclick = () => navigate("review");
        $(".book-filter").onclick = (e) => {
          const button = e.target.closest("[data-book]");
          if (!button) return;
          bookModule = button.dataset.book;
          renderTextbook();
        };
      }
      function reviewList() {
        const today = localDate();
        return reviewCards.filter((card) => {
          const progress = reviewProgress[card.id];
          return (
            (reviewModule === "all" || card.module === reviewModule) &&
            (reviewScope === "all" ||
              (reviewScope === "weak"
                ? progress?.step === 0
                : !progress || progress.due <= today))
          );
        });
      }
      function renderReview() {
        const list = reviewList();
        reviewIndex = Math.max(0, Math.min(reviewIndex, list.length - 1));
        const card = list[reviewIndex];
        const learned = reviewCards.filter(
          (item) => reviewProgress[item.id]?.step > 0,
        ).length;
        const weak = reviewCards.filter(
          (item) => reviewProgress[item.id]?.step === 0,
        ).length;
        const due = reviewCards.filter(
          (item) =>
            !reviewProgress[item.id] ||
            reviewProgress[item.id].due <= localDate(),
        ).length;
        const status = card ? reviewProgress[card.id] : null;
        $("#view").innerHTML = `
          <div class="sectionhead"><div><div class="eyebrow">ACTIVE RECALL</div><h2>오늘의 복습</h2></div><span class="note">${reviewCards.length}개 소단원 확인 문제</span></div>
          <p class="muted">질문을 보고 먼저 답을 떠올리세요. 해설을 확인한 뒤 스스로 평가하면 기록이 이 브라우저에 저장됩니다. ‘알았어요’는 1·3·7일 뒤, ‘다시 공부’는 내일 복습합니다.</p>
          <div class="review-stats" aria-label="복습 현황"><div class="panel"><strong>${due}</strong><span>오늘 할 카드</span></div><div class="panel"><strong>${learned}</strong><span>학습한 카드</span></div><div class="panel"><strong>${weak}</strong><span>다시 볼 카드</span></div></div>
          <div class="review-controls"><label>모듈<select id="reviewModule"><option value="all">전체 모듈</option>${examModules.map((m) => `<option value="${m.id}" ${reviewModule === m.id ? "selected" : ""}>${m.name}</option>`).join("")}</select></label><div class="book-filter" style="margin:0"><button data-review-scope="due" class="${reviewScope === "due" ? "active" : ""}">오늘 할 카드</button><button data-review-scope="weak" class="${reviewScope === "weak" ? "active" : ""}">다시 볼 카드</button><button data-review-scope="all" class="${reviewScope === "all" ? "active" : ""}">전체 카드</button></div></div>
          ${card ? `<article class="panel review-card"><div class="review-meta"><span>${list.length}개 중 ${reviewIndex + 1}번째 · ${card.module.toUpperCase()} · ${esc(card.chapter)}</span><span>${!status ? "처음 학습" : status.step === 0 ? `다시 보기 · ${status.due}` : `복습 ${status.step}단계 · ${status.due}`}</span></div><h3>${esc(card.question)}</h3><p class="note">${esc(card.lesson)} 단원의 핵심을 직접 설명해 보세요.</p><div class="actions"><button class="primary" data-review-action="reveal" ${reviewShown ? "hidden" : ""}>해설 보기</button><button class="secondary" data-review-action="source">교과서에서 다시 읽기</button></div>${reviewShown ? `<div class="review-answer" role="status"><strong>핵심 해설</strong><p>${esc(card.answer)}</p></div><div class="actions"><button class="secondary" data-review-action="again">다시 공부 · 내일 복습</button><button class="primary" data-review-action="known">알았어요 · 다음 복습 예약</button></div>` : ""}<div class="actions" style="justify-content:space-between;margin-top:24px"><button class="secondary" data-review-action="prev" ${reviewIndex === 0 ? "disabled" : ""}>이전 카드</button><button class="secondary" data-review-action="next" ${reviewIndex === list.length - 1 ? "disabled" : ""}>다음 카드</button></div></article>` : `<div class="panel review-empty"><h3>${reviewScope === "due" ? "오늘 할 복습을 마쳤습니다" : "조건에 맞는 카드가 없습니다"}</h3><p class="muted">${reviewScope === "due" ? "다음 복습 날짜에 다시 풀거나 전체 카드에서 먼저 공부할 수 있습니다." : "모듈이나 카드 필터를 바꿔 보세요."}</p><div class="actions"><button class="secondary" data-review-scope="all">전체 카드 보기</button><button class="primary" data-review-action="textbook">교과서 읽기</button></div></div>`}
          <p class="note" id="reviewNotice" role="status" style="margin-top:14px"></p>`;
        $("#reviewModule").onchange = (e) => {
          reviewModule = e.target.value;
          reviewIndex = 0;
          reviewShown = false;
          renderReview();
        };
      }
      $("#view").addEventListener("click", (e) => {
        const lessonButton = e.target.closest("[data-review-card]");
        if (lessonButton) {
          reviewModule = "all";
          reviewScope = "all";
          reviewIndex = reviewCards.findIndex(
            (card) => card.id === lessonButton.dataset.reviewCard,
          );
          reviewShown = false;
          navigate("review");
          return;
        }
        const scopeButton = e.target.closest("[data-review-scope]");
        if (scopeButton) {
          reviewScope = scopeButton.dataset.reviewScope;
          reviewIndex = 0;
          reviewShown = false;
          renderReview();
          return;
        }
        const action = e.target.closest("[data-review-action]")?.dataset
          .reviewAction;
        if (!action) return;
        if (action === "textbook") return navigate("textbook");
        const list = reviewList();
        const card = list[reviewIndex];
        if (!card) return;
        if (action === "source") {
          bookModule = card.module;
          navigate("textbook");
          document.getElementById(card.chapterId).open = true;
          document
            .getElementById(`${card.chapterId}-lesson-${card.lessonIndex}`)
            .scrollIntoView({ block: "center" });
          return;
        }
        if (action === "reveal") {
          reviewShown = true;
          renderReview();
          return;
        }
        if (action === "prev" || action === "next") {
          reviewIndex += action === "prev" ? -1 : 1;
          reviewShown = false;
          renderReview();
          return;
        }
        if ((action === "again" || action === "known") && reviewShown) {
          const previous = reviewProgress[card.id];
          const step =
            action === "again" ? 0 : Math.min(3, (previous?.step || 0) + 1);
          reviewProgress[card.id] = {
            step,
            due: localDate(action === "again" ? 1 : [0, 1, 3, 7][step]),
          };
          const saved = saveReview();
          if (reviewScope === "all")
            reviewIndex = Math.min(reviewIndex + 1, list.length - 1);
          reviewShown = false;
          renderReview();
          if (!saved)
            $("#reviewNotice").textContent =
              "이 브라우저의 저장소를 사용할 수 없어 복습 기록이 이번 접속에만 유지됩니다.";
        }
      });
      function guideCard(g, i) {
        return `<article class="panel question"><span class="pill">CODING & DESIGN</span><h3 style="margin-top:12px">${esc(g.title)}</h3><p class="muted">${esc(g.body)}</p>${i === 0 ? '<div class="uml" aria-label="Person 추상 클래스 UML"><div><i>«abstract» Person</i></div><div># name: String</div><div>+ label(): String<br>+ monthlyPay(): int {abstract}</div></div><p style="text-align:center" class="note">Employee ──▷ Person ◁── Contractor<br>− salary: int / − hours, rate: int</p>' : ""}<pre><code>${esc(g.code)}</code></pre></article>`;
      }
      function renderStrategy() {
        const moduleRows = examModules
          .map(
            (m) =>
              `<tr><td><strong>${m.name}</strong><br><span class="note">${m.note}</span></td><td>${m.count}</td><td>${m.points}</td></tr>`,
          )
          .join("");
        $("#view").innerHTML = `
          <div class="sectionhead"><div><div class="eyebrow">2026 OFFICIAL MODEL</div><h2>시험 구조와 공부 전략</h2></div></div>
          <section class="panel question">
            <span class="pill">공식 홈페이지 2026 기준</span>
            <h3>75문항 · 1,000점 · 150분</h3>
            <p class="muted">최신 공식 모듈 표는 소프트웨어 개발, 데이터 관리, 시스템 아키텍처·정보보안, IT 비즈니스의 4개 모듈로 구성됩니다. 기존의 ‘기술/비즈니스/통합’ 배점표 대신 아래 수치를 기준으로 학습 우선순위를 조정했습니다.</p>
            <div class="exam-note"><strong>공식 페이지 확인 메모</strong><br>평가체계 페이지 상단에는 구형 ‘65문항’ 문구가 일부 남아 있지만, 같은 페이지의 최신 M1~M4 모듈 표 합계는 75문항입니다. 이 학습 페이지는 최신 모듈 표와 2026 신규 평가모델 공지를 기준으로 표시합니다.</div>
            <table class="strategy-table"><thead><tr><th>모듈</th><th>문항</th><th>배점</th></tr></thead><tbody>${moduleRows}</tbody><tfoot><tr><th>합계</th><th>75</th><th>1,000</th></tr></tfoot></table>
          </section>
          <div class="grid2">
            <section class="panel"><span class="pill">문제 유형</span><h3>암기보다 수행을 준비하세요</h3><p class="muted">2026년 평가모델은 객관식 60문항, 서술형 7문항, 수행형 8문항입니다. 단답형은 제외됐습니다. 수행형은 코딩뿐 아니라 UML·ERD·순서도·UI 설계 등 실제 산출물을 만드는 능력을 평가합니다.</p><div class="exam-note"><strong>답안 기본 골격</strong><br>요구사항/제약 → 대안 비교 → 선택 근거 → 구현 또는 산출물 → 위험 통제 → 검증 지표</div></section>
            <section class="panel"><span class="pill">시간 전략</span><h3>문항당 평균은 약 2분</h3><p class="muted">실제로는 수행형에 더 많은 시간이 필요합니다. 짧은 문제에서 시간을 확보하고, 수행형은 요구사항 누락을 막기 위해 먼저 답안 골격을 잡으세요.</p><div class="exam-note"><strong>3회독 방식</strong><br>1차: 즉답 가능한 문제 → 2차: 계산·코드 추적 → 3차: 서술·수행형 완성 및 키워드 검수</div></section>
          </div>
          <section class="panel question"><span class="pill">7일 집중학습</span><h3>읽기 → 직접 작성 → 다음 날 복습</h3><p class="muted">1일 코드·알고리즘, 2일 UML·테스트, 3일 SQL·DB·AI, 4일 OS·네트워크·보안, 5일 비즈니스·계산, 6일 150분 리허설, 7일 오답을 권장합니다. 하루 3~4시간 기준이며 5일 압축 순서도 제공했습니다.</p><button class="primary" data-study-nav="sprint">체크리스트와 일차별 문제 열기</button></section>
          <section class="panel question"><span class="pill">PRIMARY SOURCES</span><h3>검증에 사용한 공식 자료</h3><div class="source-list">
            <a href="https://www.topcit.or.kr/introduction/question.do" target="_blank" rel="noopener">TOPCIT 공식 평가체계 — 모듈별 문항·배점·시간</a>
            <a href="https://www.topcit.or.kr/introduction/syllabus.do" target="_blank" rel="noopener">TOPCIT 공식 출제기준 V4.0E</a>
            <a href="https://www.topcit.or.kr/board/preview.do" target="_blank" rel="noopener">TOPCIT 공식 공개 예시·모의응시 — UML·ERD·컴파일러 도구 체험</a>
            <a href="https://www.topcit.or.kr/board/notice/detail.do?seq=843" target="_blank" rel="noopener">TOPCIT 2026 신규 평가모델 안내</a>
            <a href="https://swuniv.korea.ac.kr/bbs/swuniv/979/177637/download.do" target="_blank" rel="noopener">TOPCIT 2026 신규 평가모델 문항 유형표 (대학 공지 첨부)</a>
            <a href="https://isms.kisa.or.kr/sysm/intro/selectSysmCertDetail.do" target="_blank" rel="noopener">KISA — ISMS-P 인증기준 개요</a>
            <a href="https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html" target="_blank" rel="noopener">OWASP — SQL Injection과 Prepared Statement</a>
            <a href="https://pages.nist.gov/800-63-4/sp800-63b/authenticators/" target="_blank" rel="noopener">NIST SP 800-63B — 비밀번호 Salt·Hash 저장</a>
            <a href="https://www.postgresql.org/docs/17/sql-createview.html" target="_blank" rel="noopener">PostgreSQL 공식 문서 — VIEW CHECK OPTION</a>
            <a href="https://www.postgresql.org/docs/18/sql-prepare-transaction.html" target="_blank" rel="noopener">PostgreSQL 공식 문서 — 분산 트랜잭션 준비 단계</a>
            <a href="https://www.pmi.org/learning/library/evm-data-analysis-executive-action-8520" target="_blank" rel="noopener">PMI — EVM의 SPI·CPI·SV·CV</a>
          </div><p class="note">TOPCIT Essence는 <a href="https://www.topcit.or.kr/board/study.do" target="_blank" rel="noopener">열람 서비스가 종료</a>됐고, 현재 <a href="https://www.topcit.or.kr/board/library.do" target="_blank" rel="noopener">e-Learning 게시판</a>에는 공개 게시물이 없습니다. 이 사이트의 연습문제는 공식 기출 복제가 아닌 출제기준 기반 창작 문제입니다.</p></section>`;
      }
      function renderGuides() {
        $("#view").innerHTML =
          '<div class="sectionhead"><div><div class="eyebrow">LEARN BY BUILDING</div><h2>실무 수행 가이드</h2></div></div>' +
          guides.map(guideCard).join("");
      }
      try {
        if (localStorage.getItem("topcit-theme") === "dark")
          document.documentElement.classList.add("dark");
      } catch {}
      function syncTheme() {
        const dark = document.documentElement.classList.contains("dark");
        $("#theme").setAttribute(
          "aria-label",
          dark ? "라이트 모드 전환" : "다크 모드 전환",
        );
        $("#theme").setAttribute("aria-pressed", dark);
      }
      syncTheme();
      $("#theme").onclick = () => {
        const dark = document.documentElement.classList.toggle("dark");
        try {
          localStorage.setItem("topcit-theme", dark ? "dark" : "light");
        } catch {}
        syncTheme();
      };
      $("#menu").onclick = () => {
        const open = $("#sidebar").classList.toggle("open");
        $("#backdrop").classList.toggle("open", open);
        $("#menu").setAttribute("aria-expanded", open);
      };
      $("#backdrop").onclick = closeMenu;
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeMenu();
          $("#menu").focus();
        }
      });
      render();
    </script>
  </body>
